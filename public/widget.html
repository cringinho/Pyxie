<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyxie Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .pyxie-card {
      width: 100%;
      max-width: 340px;
      background: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.25), rgba(12, 6, 24, 0.95));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .pyxie-card:hover {
      border-color: rgba(236, 72, 153, 0.6);
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(244, 114, 182, 0.5);
    }
    .brand-info {
      flex: 1;
      min-width: 0;
    }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .brand-tag {
      font-size: 0.75rem;
      color: #cbd5e1;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .btn-invite {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <a href="https://pyxie.com.br/?utm_source=widget" target="_blank" rel="noopener dofollow" class="pyxie-card">
    <div class="card-top">
      <img src="https://pyxie.com.br/assets/pyxie/pyxie_pixelart_face.png" class="avatar-img" alt="Pyxie Bot" />
      <div class="brand-info">
        <div class="brand-name">
          <span>Pyxie</span>
          <span class="status-dot" title="Online no Discord"></span>
        </div>
        <div class="brand-tag">Economia • 16 Carreiras • Tarot</div>
      </div>
    </div>
    <div class="card-meta">
      <span>🔮 78 Cartas • 16 Profissões</span>
      <span class="btn-invite">+ Adicionar</span>
    </div>
  </a>
</body>
</html>
