<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyxie Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 10px;
    }
    .pyxie-card {
      width: 100%;
      max-width: 340px;
      background: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.25), rgba(12, 6, 24, 0.95));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .pyxie-card:hover {
      border-color: rgba(236, 72, 153, 0.6);
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(244, 114, 182, 0.5);
    }
    .brand-info {
      flex: 1;
      min-width: 0;
    }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
    }
    .status-dot.is-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-dot.is-offline { background: #f43f5e; }
    .status-dot.is-unknown { background: #64748b; }
    .brand-tag {
      font-size: 0.75rem;
      color: #cbd5e1;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .btn-invite {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style id="pyxie-text-fallback">
    /* Defesa: se o navegador não honrar texto com gradiente, volta para cor sólida. */
    @media (forced-colors: active), (prefers-contrast: more) {
      h1, h2, h3, [class*="title"], [class*="gradient"] {
        -webkit-text-fill-color: currentColor !important;
        background-image: none !important;
      }
    }
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      h1, h2, h3, [class*="title"], [class*="gradient"] {
        -webkit-text-fill-color: currentColor !important;
        background-image: none !important;
      }
    }
  </style>
  <style id="pyxie-mobile-perf">
    /* O celular tem altura dinâmica (barra de endereço): 100vh corta conteúdo. */
    @media (max-width: 768px) {
      * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
    /* Blur é caro no GPU de celular modesto e trava o scroll. */
    @media (prefers-reduced-transparency: reduce) {
      * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
  </style>
</head>
<body>
  <a id="card" href="https://pyxie.com.br/?utm_source=widget" target="_blank" rel="noopener dofollow" class="pyxie-card">
    <div class="card-top">
      <img src="https://pyxie.com.br/assets/pyxie/pyxie_pixelart_face-96.webp" class="avatar-img" alt="Pyxie Bot" width="44" height="44" />
      <div class="brand-info">
        <div class="brand-name">
          <span>Pyxie</span>
          <span id="statusDot" class="status-dot is-unknown" role="img" aria-label="…"></span>
        </div>
        <div class="brand-tag" id="tagline">Economia • Carreiras • Tarot</div>
      </div>
    </div>
    <div class="card-meta">
      <span id="meta">🔮 Tarot • Profissões</span>
      <span class="btn-invite" id="cta">+ Adicionar</span>
    </div>
  </a>
  <script>
    (function () {
      // Idioma: ?lang=en (o widget.js repassa o data-lang do parceiro).
      var lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pt';
      var T = {
        pt: { online: 'Online no Discord', offline: 'Fora do ar agora', unknown: 'Status indisponível', tag: 'Economia • {p} Carreiras • Tarot', tagNoNum: 'Economia • Carreiras • Tarot', meta: '🔮 {c} Cartas • {p} Profissões', metaNoNum: '🔮 Tarot • Profissões', cta: '+ Adicionar', title: 'Pyxie, bot do Discord' },
        en: { online: 'Online on Discord', offline: 'Offline right now', unknown: 'Status unavailable', tag: 'Economy • {p} Careers • Tarot', tagNoNum: 'Economy • Careers • Tarot', meta: '🔮 {c} Cards • {p} Professions', metaNoNum: '🔮 Tarot • Professions', cta: '+ Add', title: 'Pyxie, Discord bot' }
      }[lang];
      document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
      document.title = T.title;
      var card = document.getElementById('card');
      if (lang === 'en') card.href = 'https://pyxie.com.br/en/?utm_source=widget';
      var dot = document.getElementById('statusDot');
      function setStatus(state) {
        dot.className = 'status-dot is-' + state;
        dot.setAttribute('aria-label', T[state]);
        dot.title = T[state];
      }
      document.getElementById('cta').textContent = T.cta;
      document.getElementById('tagline').textContent = T.tagNoNum;
      document.getElementById('meta').textContent = T.metaNoNum;
      setStatus('unknown');
      fetch('/api/widget/summary', { headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.success) return;
          setStatus(d.online ? 'online' : 'offline');
          if (d.professions > 0) document.getElementById('tagline').textContent = T.tag.replace('{p}', d.professions);
          if (d.professions > 0 && d.tarotCards > 0) {
            document.getElementById('meta').textContent = T.meta.replace('{c}', d.tarotCards).replace('{p}', d.professions);
          }
        })
        .catch(function () { setStatus('unknown'); });
    })();
  </script>
</body>
</html>
