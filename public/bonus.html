<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyxie • Bônus Mágico Encantado</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0d0a17;
        --bg-card: rgba(23, 17, 42, 0.85);
        --purple-main: #9333ea;
        --purple-bright: #c084fc;
        --cyan-glow: #38bdf8;
        --gold-glow: #facc15;
        --emerald-glow: #22c55e;
        --pink-neon: #f43f5e;
        --text-white: #ffffff;
        --text-muted: #cbd5e1;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Quicksand', sans-serif;
        background: radial-gradient(circle at top, #231244 0%, #0d0a17 100%);
        color: var(--text-white);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
      }

      .bonus-container {
        width: 100%;
        max-width: 540px;
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 2px solid rgba(192, 132, 252, 0.3);
        border-radius: 28px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.25);
        position: relative;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .mascot-badge {
        width: 90px;
        height: 90px;
        margin: 0 auto 16px auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        box-shadow: 0 0 30px rgba(192, 132, 252, 0.6);
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      h1 {
        font-family: 'Fredoka', sans-serif;
        font-size: 1.9rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f3e8ff, #c084fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }

      /* Timer Box */
      .timer-card {
        background: rgba(13, 10, 23, 0.7);
        border: 1px solid rgba(192, 132, 252, 0.25);
        border-radius: 20px;
        padding: 24px 20px;
        margin-bottom: 24px;
      }

      .countdown-number {
        font-family: 'Fredoka', sans-serif;
        font-size: 4.5rem;
        font-weight: 700;
        line-height: 1;
        color: var(--gold-glow);
        text-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
        margin-bottom: 12px;
      }

      .progress-bar-wrap {
        width: 100%;
        height: 14px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--purple-main), var(--cyan-glow), var(--gold-glow));
        border-radius: 10px;
        transition: width 1s linear;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      }

      .status-label {
        font-size: 1rem;
        font-weight: 600;
        color: #e2e8f0;
      }

      /* Botão e Feedback */
      .btn-claim {
        display: none;
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #ffffff;
        font-family: 'Fredoka', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        transition: all 0.3s ease;
      }

      .btn-claim:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6);
      }

      .success-box {
        display: none;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid var(--emerald-glow);
        border-radius: 18px;
        padding: 20px;
        margin-top: 15px;
        animation: pop 0.4s ease-out;
      }

      .error-box {
        display: none;
        background: rgba(244, 63, 94, 0.15);
        border: 1px solid var(--pink-neon);
        border-radius: 18px;
        padding: 16px;
        margin-top: 15px;
        color: #fca5a5;
        font-size: 0.95rem;
      }

      @keyframes pop {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .sponsor-badge {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #64748b;
      }

      .sponsor-link {
        color: var(--purple-bright);
        text-decoration: none;
        font-weight: 600;
      }

      .sponsor-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="bonus-container">
      <div class="mascot-badge">✨</div>
      <h1>Pyxie Bot • Bônus Mágico</h1>
      <p class="subtitle">Aguarde a canalização da energia para desbloquear seu bônus no Discord!</p>

      <div class="timer-card">
        <div id="countdown" class="countdown-number">10</div>
        <div class="progress-bar-wrap">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div id="statusLabel" class="status-label">⚡ Canalizando energia mágica...</div>
      </div>

      <button id="btnClaim" class="btn-claim" onclick="claimBonusReward()">🎁 Resgatar Bônus Agora</button>

      <div id="successBox" class="success-box">
        <h3 style="font-family: 'Fredoka', sans-serif; font-size: 1.3rem; color: #4ade80; margin-bottom: 6px;">🎉 Bônus Mágico Creditado!</h3>
        <p id="successMessage" style="font-size: 0.95rem; color: #f1f5f9;">Seu bônus já está ativo na sua conta! Você já pode voltar para o Discord.</p>
      </div>

      <div id="errorBox" class="error-box"></div>

      <div class="sponsor-badge">
        Patrocinado com amor para a comunidade Pyxie 🐾
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const MONETAG_LINK = 'https://omg10.com/4/11793877';

      let timeLeft = 10;
      const totalTime = 10;
      const countdownEl = document.getElementById('countdown');
      const progressBarEl = document.getElementById('progressBar');
      const statusLabelEl = document.getElementById('statusLabel');
      const btnClaimEl = document.getElementById('btnClaim');
      const successBoxEl = document.getElementById('successBox');
      const errorBoxEl = document.getElementById('errorBox');
      const successMessageEl = document.getElementById('successMessage');

      if (!token) {
        countdownEl.innerText = '❌';
        statusLabelEl.innerText = 'Token inválido ou não informado!';
        errorBoxEl.style.display = 'block';
        errorBoxEl.innerText = 'Por favor, gere o link de bônus diretamente dentro do Discord no bot Pyxie.';
      } else {
        // Inicia a contagem regressiva
        const timer = setInterval(() => {
          timeLeft--;
          if (timeLeft < 0) timeLeft = 0;

          countdownEl.innerText = timeLeft;
          const percent = ((totalTime - timeLeft) / totalTime) * 100;
          progressBarEl.style.width = percent + '%';

          if (timeLeft === 0) {
            clearInterval(timer);
            statusLabelEl.innerHTML = '🌟 **Energia Pronta!** Resgatando bônus...';
            claimBonusReward();
          }
        }, 1000);
      }

      async function claimBonusReward() {
        if (!token) return;

        statusLabelEl.innerText = '🔄 Validando no servidor...';
        btnClaimEl.style.display = 'none';

        try {
          const res = await fetch('/api/bonus/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });

          const data = await res.json();

          if (data.success) {
            countdownEl.innerText = '✅';
            statusLabelEl.style.display = 'none';
            progressBarEl.style.width = '100%';
            successBoxEl.style.display = 'block';
            if (data.message) {
              successMessageEl.innerHTML = data.message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }
            // Abre o link do patrocinador suavemente após validação
            try {
              if (MONETAG_LINK) {
                window.open(MONETAG_LINK, '_blank');
              }
            } catch (_) {}
          } else {
            countdownEl.innerText = '⚠️';
            statusLabelEl.innerText = 'Falha ao validar bônus.';
            errorBoxEl.style.display = 'block';
            errorBoxEl.innerText = data.error || 'Não foi possível resgatar o bônus.';
            btnClaimEl.style.display = 'block';
          }
        } catch (err) {
          countdownEl.innerText = '⚠️';
          statusLabelEl.innerText = 'Erro de conexão com o servidor.';
          errorBoxEl.style.display = 'block';
          errorBoxEl.innerText = 'Erro de conexão. Verifique sua internet e tente novamente.';
          btnClaimEl.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
