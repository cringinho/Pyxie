      }

      .main-layout {

        align-items: center;

        gap: 24px;

      }

      .sidebar-ad {
        display: none;
        width: 160px;

        border: 1px solid rgba(192, 132, 252, 0.2);

        justify-content: center;

      @media (min-width: 1200px) {

      .center-column {

        align-items: center;

      .bonus-container {

        border-radius: 28px;
        padding: 30px 24px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.25);
        position: relative;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .mascot-badge {
        width: 80px;
        height: 80px;
        margin: 0 auto 14px auto;
        border-radius: 50%;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        box-shadow: 0 0 30px rgba(192, 132, 252, 0.6);
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      h1 {
        font-family: 'Fredoka', sans-serif;
        font-size: 1.85rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f3e8ff, #c084fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }

      .subtitle {
        color: var(--text-muted);

      }

      /* Timer Box */
      .timer-card {
        background: rgba(13, 10, 23, 0.75);
        border: 1px solid rgba(192, 132, 252, 0.25);
        border-radius: 20px;
        padding: 20px 16px;
        margin-bottom: 18px;
      }

      .countdown-number {
        font-family: 'Fredoka', sans-serif;
        font-size: 4.2rem;
        font-weight: 700;
        line-height: 1;
        color: var(--gold-glow);
        text-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
        margin-bottom: 10px;
      }

      .progress-bar-wrap {
        width: 100%;
        height: 14px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--purple-main), var(--cyan-glow), var(--gold-glow));
        border-radius: 10px;
        transition: width 1s linear;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
      }

      .status-label {

        font-weight: 600;

      /* Native Ad Container */
      .native-ad-section {
        width: 100%;
        margin: 14px 0;
        border-radius: 16px;
        overflow: hidden;
        background: rgba(13, 10, 23, 0.4);
        border: 1px solid rgba(192, 132, 252, 0.15);
        padding: 4px;

      /* Botão e Feedback */

        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #ffffff;
        font-family: 'Fredoka', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        transition: all 0.3s ease;
      }

      .btn-claim:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6);
      }

      .success-box {
        display: none;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid var(--emerald-glow);
        border-radius: 18px;
        padding: 18px;

      }

      .error-box {
        display: none;
        background: rgba(244, 63, 94, 0.15);

        border-radius: 18px;
        padding: 16px;
        margin-top: 14px;
        color: #fca5a5;
        font-size: 0.95rem;
      }

      @keyframes pop {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .sponsor-badge {

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const MONETAG_LINK = 'https://omg10.com/4/11793877';

      let timeLeft = 10;
      const totalTime = 10;
      const countdownEl = document.getElementById('countdown');
      const progressBarEl = document.getElementById('progressBar');
      const statusLabelEl = document.getElementById('statusLabel');
      const btnClaimEl = document.getElementById('btnClaim');
      const successBoxEl = document.getElementById('successBox');
      const errorBoxEl = document.getElementById('errorBox');
      const successMessageEl = document.getElementById('successMessage');

      if (!token) {
        countdownEl.innerText = '🎁';
        statusLabelEl.innerText = '✨ Bem-vindo ao Bônus Mágico da Pyxie!';
        errorBoxEl.style.display = 'block';
        errorBoxEl.style.background = 'rgba(147, 51, 234, 0.15)';
        errorBoxEl.style.borderColor = 'rgba(192, 132, 252, 0.4)';
        errorBoxEl.style.color = '#e2e8f0';
        errorBoxEl.innerHTML = 'Para creditar **Ampulhetas Mágicas (2h) ⏳** e **Moedas 🪙** na sua conta, gere seu link exclusivo usando <code>/py-bonus</code>, <code>/py-daily</code> ou <code>/py-inventory</code> no Discord!<br><br><a href="' + MONETAG_LINK + '" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline;">👉 Clique aqui para apoiar com o patrocinador</a>';
      } else {
        // Inicia a contagem regressiva de 10 segundos
        const timer = setInterval(() => {
          timeLeft--;
          if (timeLeft < 0) timeLeft = 0;

          countdownEl.innerText = timeLeft;
          const percent = ((totalTime - timeLeft) / totalTime) * 100;
          progressBarEl.style.width = percent + '%';

          if (timeLeft === 0) {
            clearInterval(timer);
            countdownEl.innerText = '✨';
            statusLabelEl.innerHTML = '🌟 <strong>Energia Pronta!</strong> Clique abaixo para resgatar:';
            btnClaimEl.style.display = 'block';
          }
        }, 1000);
      }

      async function claimBonusReward() {
        if (!token) return;

        // 1. Abre o link da Monetag diretamente no evento de clique do usuário
        try {
          if (MONETAG_LINK) {
            window.open(MONETAG_LINK, '_blank');
          }
        } catch (_) {}

        statusLabelEl.innerText = '🔄 Creditando bônus no seu inventário...';
        btnClaimEl.style.display = 'none';

        try {
          const res = await fetch('/api/bonus/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });

          const data = await res.json();

          if (data.success) {
            countdownEl.innerText = '✅';
            statusLabelEl.style.display = 'none';
            progressBarEl.style.width = '100%';
            successBoxEl.style.display = 'block';
            if (data.message) {
              successMessageEl.innerHTML = data.message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }
          } else {
            countdownEl.innerText = '⚠️';
            statusLabelEl.innerText = 'Falha ao validar bônus.';
            errorBoxEl.style.display = 'block';
            errorBoxEl.innerText = data.error || 'Não foi possível resgatar o bônus.';
            btnClaimEl.style.display = 'block';
          }
        } catch (err) {
          countdownEl.innerText = '⚠️';
          statusLabelEl.innerText = 'Erro de conexão com o servidor.';
          errorBoxEl.style.display = 'block';
          errorBoxEl.innerText = 'Erro de conexão. Verifique sua internet e tente novamente.';
          btnClaimEl.style.display = 'block';
        }
      }
    </script>
