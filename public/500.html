<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 • Sobrecarga Arcana | Pyxie</title>
  <meta name="description" content="Algo deu errado do nosso lado. Tente de novo em alguns minutos." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% -15%, #3b1464 0%, rgba(14, 7, 26, 0.98) 45%, #07040d 100%),
        #07040d;
      overflow-x: hidden;
    }
    #noise-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; pointer-events: none; z-index: 0; opacity: 0.25; }
    .err {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
    }
    .err-card { max-width: 32rem; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .err-art { position: relative; margin-bottom: 24px; }
    .err-ring {
      width: 144px; height: 144px; padding: 8px; border-radius: 999px;
      background: linear-gradient(45deg, #f59e0b, #e11d48, #9333ea);
      box-shadow: 0 0 30px rgba(230, 0, 103, 0.4);
    }
    .err-ring img { width: 100%; height: 100%; object-fit: contain; border-radius: 999px; background: #0e071a; padding: 12px; }
    .err-code {
      position: absolute; top: -8px; right: -12px;
      padding: 4px 12px; border-radius: 999px;
      font: 800 12px/1.4 'JetBrains Mono', ui-monospace, monospace;
      color: #fda4af; background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.4);
    }
    h1 { margin: 0 0 12px; font: 900 clamp(1.8rem, 6vw, 2.4rem)/1.15 'Outfit', sans-serif; letter-spacing: -0.02em; }
    .err-card p { margin: 0 0 32px; color: #cbd5e1; line-height: 1.7; }
    .err-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
    .err-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 22px; border-radius: 16px; font: 700 14px/1 'Outfit', sans-serif; text-decoration: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .err-btn:hover { transform: translateY(-2px); }
    .err-btn-main { color: #fff; background: linear-gradient(90deg, #db2777, #9333ea, #4f46e5); box-shadow: 0 0 25px rgba(230, 0, 103, 0.45); }
    .err-btn-ghost { color: #e9d5ff; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(168, 85, 247, 0.3); }
    .err-btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }
    @media (max-width: 480px) { .err-btn { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .err-btn { transition: none; } }
  </style>
</head>
<body>
  <canvas id="noise-canvas" aria-hidden="true"></canvas>
  <!--pyx:header-->
  <main class="err" id="pxc-main">
    <div class="err-card">
      <div class="err-art">
        <div class="err-ring"><img src="/assets/pyxie/pyxie_mascot-288.webp" alt="Pyxie, a fadinha, confusa" data-en-alt="Pyxie, the fairy, confused" width="128" height="128" /></div>
        <span class="err-code" data-i18n-err>ERRO 500</span>
      </div>
      <h1 data-i18n-err>Sobrecarga arcana!</h1>
      <p data-i18n-err>Algo deu errado do nosso lado. Tente de novo em alguns minutos; se continuar, avise no servidor de suporte.</p>
      <div class="err-actions">
        <a class="err-btn err-btn-main" href="/" data-en-href="/en/"><span aria-hidden="true">🔮</span><span data-i18n-err>Voltar para um lugar seguro</span></a>
        <a class="err-btn err-btn-ghost" href="/discord" data-en-href="/discord" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">💬</span><span data-i18n-err>Servidor de suporte</span></a>
      </div>
    </div>
  </main>
  <!--pyx:footer-->
  <script>
    (function initNoise() {
      const canvas = document.getElementById('noise-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.7 + 0.3,
        speed: Math.random() * 0.02 + 0.01,
      }));

      // Quem pediu menos movimento no aparelho vê as estrelas paradas; com a aba escondida
      // a animação para (sem gastar bateria à toa).
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      let frame = null;

      function draw(animate) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#a855f7';
        for (const s of stars) {
          if (animate) s.alpha += Math.sin(Date.now() * s.speed) * 0.02;
          ctx.globalAlpha = Math.max(0.1, Math.min(0.9, s.alpha));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop() {
        draw(true);
        frame = requestAnimationFrame(loop);
      }

      function stop() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
      }

      function start() {
        stop();
        if ((reduceMotion && reduceMotion.matches) || document.hidden) {
          draw(false);
          return;
        }
        loop();
      }

      document.addEventListener('visibilitychange', start);
      if (reduceMotion && reduceMotion.addEventListener) reduceMotion.addEventListener('change', start);
      window.addEventListener('resize', () => {
        if (frame === null) draw(false);
      });
      start();
    })();
  </script>
  <script>
    // Versão em inglês quando a URL é /en/... (o servidor escreve <html lang="en">).
    (function () {
      if (!document.documentElement.lang.toLowerCase().startsWith('en')) return;
      var EN = ["ERROR 500", "Arcane overload!", "Something went wrong on our side. Please try again in a few minutes; if it keeps happening, let us know on the support server.", "Back to a safe place", "Support server"];
      var nodes = document.querySelectorAll('[data-i18n-err]');
      for (var i = 0; i < nodes.length && i < EN.length; i++) nodes[i].textContent = EN[i];
      document.title = "500 • Something Went Wrong | Pyxie";
      var links = document.querySelectorAll('[data-en-href]');
      for (var j = 0; j < links.length; j++) links[j].setAttribute('href', links[j].getAttribute('data-en-href'));
      var img = document.querySelector('[data-en-alt]');
      if (img) img.alt = img.getAttribute('data-en-alt');
    })();
  </script>
</body>
</html>
