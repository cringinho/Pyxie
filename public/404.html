<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex, follow" />

  <style>
    body {
      margin: 0;
      background-color: #080410;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #noise-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
    }
  </style>
  <style id="pyxie-text-fallback">
    /* Defesa: se o navegador não honrar texto com gradiente, volta para cor sólida. */
    @media (forced-colors: active), (prefers-contrast: more) {
      h1, h2, h3, [class*="title"], [class*="gradient"] {
        -webkit-text-fill-color: currentColor !important;
        background-image: none !important;
      }
    }
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      h1, h2, h3, [class*="title"], [class*="gradient"] {
        -webkit-text-fill-color: currentColor !important;
        background-image: none !important;
      }
    }
  </style>
  <style id="pyxie-mobile-perf">
    /* O celular tem altura dinâmica (barra de endereço): 100vh corta conteúdo. */
    @media (max-width: 768px) {
      * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
    /* Blur é caro no GPU de celular modesto e trava o scroll. */
    @media (prefers-reduced-transparency: reduce) {
      * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
  </style>
</head>
<body class="selection:bg-pink-500 selection:text-white">
  <canvas id="noise-canvas"></canvas>

  <div class="relative z-10 max-w-lg mx-auto px-6 py-12 text-center flex flex-col items-center">
    <div class="relative mb-6">
      <div class="w-36 h-36 rounded-full p-2 bg-gradient-to-tr from-pink-500 via-purple-600 to-cyan-400 shadow-neon-pink animate-pulse">
        <img
          src="/assets/pyxie/pyxie_mascot-288.webp"
          alt="Pyxie Fadinha Perdida" data-i18n-alt
          class="w-full h-full object-contain rounded-full bg-[#0e071a] p-3"
        />
      </div>
      <span class="absolute -top-2 -right-2 px-3 py-1 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-300 font-mono font-black text-xs" data-i18n="badge">
        ERRO 404
      </span>
    </div>

    <h1 class="font-title font-black text-3xl sm:text-4xl text-white mb-3 tracking-tight" data-i18n="heading">
      Dimensão Não Encontrada!
    </h1>

    <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-8 max-w-md" data-i18n="body">
      A Pyxie procurou em todas as constelações astrais e nos registros arcanos, mas essa página parece ter sumido no vácuo do espaço.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-3 w-full justify-center">
      <a
        href="/"
        data-home-link
        class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:from-pink-500 hover:to-purple-500 text-white font-title font-bold text-sm shadow-neon-pink transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2"
      >
        <span>🔮</span>
        <span data-i18n="home">Voltar para um Lugar Seguro</span>
      </a>
      <a
        href="/wiki"
        class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-purple-500/30 text-purple-200 font-title font-semibold text-sm transition-all flex items-center justify-center gap-2"
      >
        <span>📖</span>
        <span data-i18n="second">Guia de Comandos</span>
      </a>
    </div>
  </div>

  <script>
    (function initNoise() {
      const canvas = document.getElementById('noise-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.7 + 0.3,
        speed: Math.random() * 0.02 + 0.01,
      }));

      // Quem pediu menos movimento no aparelho vê as estrelas paradas; com a aba escondida
      // a animação para (sem gastar bateria à toa).
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      let frame = null;

      function draw(animate) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#f472b6';
        for (const s of stars) {
          if (animate) s.alpha += Math.sin(Date.now() * s.speed) * 0.02;
          ctx.globalAlpha = Math.max(0.1, Math.min(0.9, s.alpha));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop() {
        draw(true);
        frame = requestAnimationFrame(loop);
      }

      function stop() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
      }

      function start() {
        stop();
        if ((reduceMotion && reduceMotion.matches) || document.hidden) {
          draw(false);
          return;
        }
        loop();
      }

      document.addEventListener('visibilitychange', start);
      if (reduceMotion && reduceMotion.addEventListener) reduceMotion.addEventListener('change', start);
      window.addEventListener('resize', () => {
        if (frame === null) draw(false);
      });
      start();
    })();
  </script>
  <script>
    // Versão em inglês: /en/..., ?lang=en ou navegador em inglês (sem ?lang=pt). AGENTS §1.
    (function errorPageLang() {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('lang');
      var isEn = q === 'en' || (q !== 'pt' && (/^\/en(\/|$)/.test(window.location.pathname) || /^en\b/i.test(navigator.language || '')));
      if (!isEn) return;
      var EN = {"title": "404 • Page Not Found | Pyxie Discord Bot", "description": "The page you are looking for has moved or never existed.", "alt": "Pyxie, a lost little fairy", "badge": "ERROR 404", "heading": "Page Not Found!", "body": "Pyxie searched every constellation and every magic record, but this page seems to have vanished. The link may be broken or the page may have moved.", "home": "Back to a Safe Place", "second": "Command Guide"};
      document.documentElement.lang = 'en';
      document.title = EN.title;
      var desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute('content', EN.description);
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (EN[key]) el.textContent = EN[key];
      });
      var img = document.querySelector('[data-i18n-alt]');
      if (img) img.setAttribute('alt', EN.alt);
      var home = document.querySelector('[data-home-link]');
      if (home) home.setAttribute('href', '/en/');
    })();
  </script>
</body>
</html>
