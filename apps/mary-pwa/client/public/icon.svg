<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A1E"/>
      <stop offset="50%" stop-color="#260C2C"/>
      <stop offset="100%" stop-color="#0B090E"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85"/>
      <stop offset="100%" stop-color="#E60067"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#E60067" stroke-width="6" opacity="0.4"/>

  <!-- Estrelas de Fundo -->
  <circle cx="110" cy="120" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="390" cy="110" r="4" fill="#FF75B5" opacity="0.9"/>
  <circle cx="100" cy="380" r="3.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="410" cy="390" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="256" cy="70" r="5" fill="#F59E0B" opacity="0.9" filter="url(#glow)"/>

  <!-- Coração Central do Casal -->
  <path d="M256,410 C180,330 110,260 110,180 C110,120 160,80 220,80 C240,80 256,92 256,92 C256,92 272,80 292,80 C352,80 402,120 402,180 C402,260 332,330 256,410 Z" fill="url(#pinkGrad)" filter="url(#glow)"/>

  <!-- Letras M & L Entrelaçadas -->
  <text x="256" y="255" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">M &amp; L</text>
  <text x="256" y="295" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" fill="#FFD1E6" text-anchor="middle">Nosso Universo</text>
</svg>
